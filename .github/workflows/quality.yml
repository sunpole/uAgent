name: uAgent quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check version policy and generated site
        run: npm run check
      - name: Verify current release media with canonical uNews dry-run
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/sunpole/uNews.git "$RUNNER_TEMP/uNews"
          VERSION=$(node -p "require('./version.json').version")
          FOUND=0
          for item in news/[0-9]*-uagent-*.md; do
            if [ ! -f "$item" ]; then continue; fi
            if grep -Fxq "version: ${VERSION}" "$item"; then
              FOUND=$((FOUND + 1))
              (cd "$RUNNER_TEMP/uNews" && node scripts/publish-from-projects.js --check "$GITHUB_WORKSPACE/$item")
            fi
          done
          test "$FOUND" -eq 1 || { echo 'Expected exactly one uNews post for current version'; exit 1; }
      - name: Generate repo graph
        run: node scripts/repo-map.mjs
      - name: Ensure repo graph is committed and synchronized
        run: git diff --exit-code -- docs/repo-graph.json docs/REPO_MAP.md
