name: uAgent quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check version policy and generated site
        run: npm run check
      - name: Generate repo graph
        run: node scripts/repo-map.mjs
      - name: Ensure repo graph is committed and synchronized
        run: git diff --exit-code -- docs/repo-graph.json docs/REPO_MAP.md
